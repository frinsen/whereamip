name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Create GitHub release
        run: |
          cat > /tmp/install-notes.md <<'NOTES'
          ## Install (no download needed — Homebrew builds it for you)

          ```bash
          brew tap frinsen/tap
          brew trust frinsen/tap   # newer Homebrew requires trusting third-party taps once
          brew install whereamip   # or: brew upgrade whereamip
          open "$(brew --prefix)/opt/whereamip/libexec/WhereAmIP.app"
          ```

          Homebrew is the recommended path: locally built apps need no Apple
          notarization and trigger no Gatekeeper warnings. Requires Xcode Command Line Tools.

          ## Direct download (for the impatient)

          `WhereAmIP.app.zip` below is a prebuilt, **unsigned** app (we don't pay Apple's
          notarization toll). macOS will refuse to open it normally — after unzipping,
          either right-click the app → Open → Open, or clear the quarantine flag:

          ```bash
          xattr -d com.apple.quarantine WhereAmIP.app
          ```

          Updates are manual on this path — `brew upgrade` only serves Homebrew installs.

          ---
          NOTES
          # Idempotent: a rerun must be able to finish a release that half-happened. Our own
          # v0.4.2 cut hit exactly this — `gh release create` 503'd after the release existed,
          # and a rerun would then have died on "release already exists", permanently blocking
          # the asset upload and the formula bump below.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — skipping create, continuing to upload"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --notes-file /tmp/install-notes.md
          fi
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and attach app bundle
        run: |
          scripts/make-app-bundle.sh dist
          ditto -c -k --keepParent dist/WhereAmIP.app "dist/WhereAmIP.app.zip"
          # --clobber so a rerun after a partial upload replaces the asset instead of failing.
          gh release upload --clobber "$GITHUB_REF_NAME" "dist/WhereAmIP.app.zip"
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Bump Homebrew formula
        env: { TAP_TOKEN: "${{ secrets.TAP_PUSH_TOKEN }}" }
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "TAP_PUSH_TOKEN not set — bump formula manually"; exit 0; fi
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/frinsen/whereamip/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA=$(curl -fsSL "$URL" | shasum -a 256 | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/frinsen/homebrew-tap.git" tap
          cd tap
          sed -i '' -e "s|^  url \".*\"|  url \"${URL}\"|" -e "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Formula/whereamip.rb
          git -c user.name=release-bot -c user.email=bot@users.noreply.github.com \
              commit -am "whereamip ${VERSION}"
          git push
