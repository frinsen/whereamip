name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and AppIndicator headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-3-dev libayatana-appindicator3-dev
      - name: Build
        run: swift build
      - name: Test
        run: swift test
